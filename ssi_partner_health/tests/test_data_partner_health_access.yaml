      - step: "Assert admin belongs to the group"
        action: "assert"
        target: "admin_user"
        asserts:
          groups_id:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: health_group"

  - name: "Config - No Ungrouped Or Internal Group ACL Remains"
    steps:
      - step: "No ACL without group"
        action: "search"
        model: "ir.model.access"
        domain:
          - [
              "model_id.model",
              "in",
              [
                "partner.height",
                "partner.weight",
                "partner.head_circumference",
                "partner.allergy",
                "partner.disease_history",
                "partner.medication",
                "partner.health_provider",
              ],
            ]
          - ["group_id", "=", false]
        save_as: "ungrouped_acl"
        expect_count: 0
      - step: "No ACL for internal user group"
        action: "search"
        model: "ir.model.access"
        domain:
          - [
              "model_id.model",
              "in",
              [
                "partner.height",
                "partner.weight",
                "partner.head_circumference",
                "partner.allergy",
                "partner.disease_history",
                "partner.medication",
                "partner.health_provider",
              ],
            ]
          - ["group_id", "=", "REC: internal_group.id"]
        save_as: "internal_acl"
        expect_count: 0
      - step: "Exactly one ACL per model for the health group"
        action: "search"
        model: "ir.model.access"
        domain:
          - [
              "model_id.model",
              "in",
              [
                "partner.height",
                "partner.weight",
                "partner.head_circumference",
                "partner.allergy",
                "partner.disease_history",
                "partner.medication",
                "partner.health_provider",
              ],
            ]
          - ["group_id", "=", "REC: health_group.id"]
        save_as: "health_acl"
        expect_count: 7
