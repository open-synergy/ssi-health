setup:
  steps:
    - step: "Create partner"
      action: "create"
      model: "res.partner"
      save_as: "partner"
      values:
        name: "Test Partner Health Access"
        is_company: false
    - step: "Create doctor partner"
      action: "create"
      model: "res.partner"
      save_as: "doctor"
      values:
        name: "Dr. Access Test"
        is_company: false
    - step: "Create allergen"
      action: "create"
      model: "health.allergen"
      save_as: "allergen"
      values:
        name: "Access Peanut"
        code: "/"
    - step: "Create disease"
      action: "create"
      model: "health.disease"
      save_as: "disease"
      values:
        name: "Access Hypertension"
        code: "/"
    - step: "Create medication"
      action: "create"
      model: "health.medication"
      save_as: "medication"
      values:
        name: "Access Paracetamol"
        code: "/"
    - step: "Get partner health group"
      action: "ref"
      xml_id: "ssi_partner_health.partner_health_group"
      save_as: "health_group"
    - step: "Get internal user group"
      action: "ref"
      xml_id: "base.group_user"
      save_as: "internal_group"
    - step: "Create plain internal user"
      action: "create"
      model: "res.users"
      save_as: "user_plain"
      values:
        name: "Plain Internal User"
        # Login is generated per replay of this setup block (unique key).
        login: "EVAL: 'plain_health_%d@example.com' % env['res.users'].search_count([])"
        groups_id: [[6, 0, ["REF: base.group_user"]]]
    - step: "Create health user"
      action: "create"
      model: "res.users"
      save_as: "user_health"
      values:
        name: "Health Internal User"
        login:
          "EVAL: 'member_health_%d@example.com' % env['res.users'].search_count([])"
        groups_id:
          [
            [
              6,
              0,
              ["REF: base.group_user", "REF: ssi_partner_health.partner_health_group"],
            ],
          ]

scenarios:
  - name: "Negative - Internal User Without Group Is Denied"
