      - step: "Create height as superuser"
        action: "create"
        model: "partner.height"
        save_as: "height"
        values:
          partner_id: "REC: partner.id"
          date: 2024-01-01
          value: 170.0
      - step: "Plain user cannot create height"
        action: "create"
        model: "partner.height"
        as_user: "user_plain"
        expect_error:
          type: "AccessError"
        values:
          partner_id: "REC: partner.id"
          date: 2024-01-01
          value: 170.0
      - step: "Plain user cannot search height"
        action: "search"
        model: "partner.height"
        as_user: "user_plain"
        domain:
          - ["partner_id", "=", "REC: partner.id"]
        save_as: "found_height"
        expect_error:
          type: "AccessError"
      - step: "Plain user cannot write height"
        action: "write"
        target: "height"
        as_user: "user_plain"
