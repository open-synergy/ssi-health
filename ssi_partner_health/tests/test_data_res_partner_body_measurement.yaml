setup:
  steps:
    - step: "Create partner"
      action: "create"
      model: "res.partner"
      save_as: "partner"
      values:
        name: "Test Partner Body Measurement"
        is_company: false

scenarios:
  - name: "Compute Height - Single Measurement"
    steps:
      - step: "Create height measurement"
        action: "create"
        model: "partner.height"
        save_as: "height"
        values:
          partner_id: "REC: partner.id"
          date: 2024-01-01
          value: 170.0
      - step: "Assert partner height"
        action: "assert"
        target: "partner"
        asserts:
          height:
            type: "value"
            expected: 170.0

  - name: "Compute Weight - Single Measurement"
    steps:
      - step: "Create weight measurement"
        action: "create"
        model: "partner.weight"
        save_as: "weight"
        values:
          partner_id: "REC: partner.id"
          date: 2024-01-01
          value: 65.5
      - step: "Assert partner weight"
        action: "assert"
        target: "partner"
        asserts:
          weight:
            type: "value"
            expected: 65.5

  - name: "Compute Head Circumference - Single Measurement"
    steps:
      - step: "Create head circumference measurement"
        action: "create"
        model: "partner.head_circumference"
        save_as: "head_circumference"
        values:
          partner_id: "REC: partner.id"
          date: 2024-01-01
          value: 55.0
      - step: "Assert partner head circumference"
        action: "assert"
        target: "partner"
        asserts:
          head_circumference:
            type: "value"
            expected: 55.0

  - name: "Compute Empty - No Measurement"
    steps:
      - step: "Assert all measurements default to zero"
        action: "assert"
        target: "partner"
        asserts:
          height:
            type: "value"
            expected: 0.0
          weight:
            type: "value"
            expected: 0.0
          head_circumference:
            type: "value"
            expected: 0.0

  - name: "Compute Takes Latest Date, Not Latest ID"
    steps:
      - step: "Create height with newer date first"
        action: "create"
        model: "partner.height"
        save_as: "height_new"
        values:
          partner_id: "REC: partner.id"
          date: 2024-06-01
          value: 172.0
      - step: "Create height with older date second"
        action: "create"
        model: "partner.height"
        save_as: "height_old"
        values:
          partner_id: "REC: partner.id"
          date: 2024-01-01
          value: 160.0
      - step: "Assert partner height reflects newer date, not higher id"
        action: "assert"
        target: "partner"
        asserts:
          height:
            type: "value"
            expected: 172.0

  - name: "Compute After Unlink Falls Back to Remaining Latest"
    steps:
      - step: "Create height with newer date first"
        action: "create"
        model: "partner.height"
        save_as: "height_new"
        values:
          partner_id: "REC: partner.id"
          date: 2024-06-01
          value: 172.0
      - step: "Create height with older date second"
        action: "create"
        model: "partner.height"
        save_as: "height_old"
        values:
          partner_id: "REC: partner.id"
          date: 2024-01-01
          value: 160.0
      - step: "Assert partner height is the newer measurement"
        action: "assert"
        target: "partner"
        asserts:
          height:
            type: "value"
            expected: 172.0
      - step: "Delete the newer measurement"
        action: "unlink"
        target: "height_new"
      - step: "Assert partner height falls back to the remaining older one"
        action: "assert"
        target: "partner"
        asserts:
          height:
            type: "value"
            expected: 160.0
